name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out Sideband
        uses: actions/checkout@v4

      - name: Check out Reticulum
        uses: actions/checkout@v4
        with:
          repository: markqvist/Reticulum
          path: dependencies/Reticulum

      - name: Check out LXMF
        uses: actions/checkout@v4
        with:
          repository: markqvist/LXMF
          path: dependencies/LXMF

      - name: Check out LXST
        uses: actions/checkout@v4
        with:
          repository: markqvist/LXST
          path: dependencies/LXST

      - name: Link sibling dependencies
        run: |
          ln -s "$GITHUB_WORKSPACE/dependencies/Reticulum" "$GITHUB_WORKSPACE/../Reticulum"
          ln -s "$GITHUB_WORKSPACE/dependencies/LXMF" "$GITHUB_WORKSPACE/../LXMF"
          ln -s "$GITHUB_WORKSPACE/dependencies/LXST" "$GITHUB_WORKSPACE/../LXST"

      - name: Create build environment file
        run: touch environment

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libffi-dev libssl-dev libsqlite3-dev patchelf unzip zip
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.6.0 cython==0.29.37
          sdkmanager --install "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          # p4a's CPython 3.11 cross wrapper needs PYTHONPATH for native stdlib modules.
          PIP_CONSTRAINT: ${{ github.workspace }}/recipes/android-build-constraints.txt
          SIDEBAND_SKIP_SHARE_FETCH: 1
          SIDEBAND_LXST_SOURCE_DIR: ${{ github.workspace }}/dependencies/LXST
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if (make apk && make fetchapk) 2>&1 | tee "$RUNNER_TEMP/sideband-android-build.log"; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              python .github/scripts/collect_android_error.py \
                "$RUNNER_TEMP/sideband-android-build.log" "$RUNNER_TEMP/sideband-android-error.txt"
              exit 1
            fi

            delay=$((attempt * 30))
            echo "APK build failed; retrying in ${delay} seconds (attempt ${attempt}/3)..."
            sleep "$delay"
          done

      # One approved test release only. PRs and ordinary future pushes stay unsigned.
      - name: Test-sign the approved Android release
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          startsWith(github.event.head_commit.message, 'Release Sideband 1.9.2 Chinese test build (2026-10-02)')
        env:
          RELEASE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          release_title='Release Sideband 1.9.2 Chinese test build (2026-10-02)'
          [[ "${RELEASE_COMMIT_MESSAGE%%$'\n'*}" == "$release_title" ]] || exit 0
          key="$RUNNER_TEMP/sideband-test-signing.jks"
          export SIDEBAND_TEST_STOREPASS=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')
          echo "::add-mask::$SIDEBAND_TEST_STOREPASS"
          cleanup() { rm -f "$key"; unset SIDEBAND_TEST_STOREPASS; }
          trap cleanup EXIT
          keytool -genkeypair -noprompt -alias sideband-test -keystore "$key" \
            -storepass:env SIDEBAND_TEST_STOREPASS -keypass:env SIDEBAND_TEST_STOREPASS \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname 'CN=Sideband zh-CN temporary test build'
          for apk in dist/*-release-unsigned.apk; do
            test -f "$apk"
            aligned="$RUNNER_TEMP/sideband-aligned.apk"
            output="${apk%-release-unsigned.apk}-test-signed.apk"
            "$ANDROID_SDK_ROOT/build-tools/33.0.2/zipalign" -f -p 4 "$apk" "$aligned"
            "$ANDROID_SDK_ROOT/build-tools/33.0.2/apksigner" sign --ks "$key" \
              --ks-key-alias sideband-test --ks-pass env:SIDEBAND_TEST_STOREPASS \
              --key-pass env:SIDEBAND_TEST_STOREPASS --out "$output" "$aligned"
            "$ANDROID_SDK_ROOT/build-tools/33.0.2/apksigner" verify --verbose --print-certs "$output"
            rm -f "$apk" "$aligned"
          done
          # The private key is not retained or uploaded; only the public certificate is reported.

      - name: Verify APK
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          apks = list(Path("dist").glob("*.apk"))
          assert apks, "No release APK was produced"
          for apk in apks:
              with zipfile.ZipFile(apk) as archive:
                  names = archive.namelist()
                  assert archive.testzip() is None, f"Corrupt APK: {apk}"
                  assert "AndroidManifest.xml" in names, f"Missing manifest: {apk}"
                  assert "classes.dex" in names, f"Missing Android code: {apk}"
                  assert any(n.startswith("lib/arm64-v8a/") for n in names), f"Missing arm64 libraries: {apk}"
          PY
          test -x "$ANDROID_SDK_ROOT/build-tools/33.0.2/apksigner"
          certificate_report=$(mktemp)
          trap 'rm -f "$certificate_report"' EXIT
          : > dist/APK-SIGNATURE.txt
          for apk in dist/*.apk; do
            if "$ANDROID_SDK_ROOT/build-tools/33.0.2/apksigner" verify --print-certs "$apk" > "$certificate_report"; then
              echo "$(basename "$apk"): signature verified" >> dist/APK-SIGNATURE.txt
              if [[ "$apk" == *-test-signed.apk ]]; then
                echo "TEST SIGNATURE ONLY. The private key is not retained. A later build may require uninstalling this version; back up your identity/messages first. Cannot update upstream installations with a different certificate." >> dist/APK-SIGNATURE.txt
              fi
              cat "$certificate_report" >> dist/APK-SIGNATURE.txt
            elif [[ "$apk" == *-release-unsigned.apk ]]; then
              echo "$(basename "$apk"): unsigned, not installable until signed with an authorized existing key" >> dist/APK-SIGNATURE.txt
            else
              echo "Unexpected signature verification failure: $apk" >&2
              exit 1
            fi
          done
          cat dist/APK-SIGNATURE.txt
          sha256sum dist/*.apk > dist/SHA256SUMS

      - name: Upload bounded build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sideband-android-diagnostics-${{ github.run_number }}
          path: ${{ runner.temp }}/sideband-android-error.txt
          if-no-files-found: warn
          retention-days: 3

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sideband-android-apk-${{ github.run_number }}
          path: |
            dist/*.apk
            dist/APK-SIGNATURE.txt
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
