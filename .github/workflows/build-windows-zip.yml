name: Build Windows ZIP

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out Sideband
        uses: actions/checkout@v4

      - name: Check out Reticulum
        uses: actions/checkout@v4
        with:
          repository: markqvist/Reticulum
          path: dependencies/Reticulum

      - name: Check out LXMF
        uses: actions/checkout@v4
        with:
          repository: markqvist/LXMF
          path: dependencies/LXMF

      - name: Check out LXST
        uses: actions/checkout@v4
        with:
          repository: markqvist/LXST
          path: dependencies/LXST

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller kivy kivy-deps.sdl2 kivy-deps.glew .

      - name: Prepare Windows build sources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path sideband_sources | Out-Null
          Copy-Item -Recurse -Path sbapp -Destination sideband_sources/sbapp
          Copy-Item -Path main.py, sideband.spec -Destination sideband_sources
          Copy-Item -Recurse -Path dependencies/Reticulum/RNS -Destination sideband_sources/RNS
          Copy-Item -Recurse -Path dependencies/LXMF/LXMF -Destination sideband_sources/LXMF
          Copy-Item -Recurse -Path dependencies/LXST/LXST -Destination sideband_sources/LXST

      - name: Build Windows ZIP
        shell: cmd
        env:
          KIVY_GL_BACKEND: mock
        run: winbuild.bat

      - name: Verify Windows ZIP
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          packages = list(Path("dist").glob("*.zip"))
          assert packages, "No Windows ZIP was produced"
          for package in packages:
              with zipfile.ZipFile(package) as archive:
                  assert archive.testzip() is None, f"Corrupt ZIP: {package}"
                  assert any(n.endswith("/Sideband.exe") for n in archive.namelist()), f"Missing executable: {package}"
          PY

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: sideband-windows-zip-${{ github.run_number }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
